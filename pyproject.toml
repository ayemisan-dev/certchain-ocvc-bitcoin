[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "certichain-bitcoin"
version = "0.1.0"
description = "Bitcoin-based Certificate Verification System (OCVC protocol)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Web
    "flask>=3.1,<4",
    "flask-cors>=6.0,<7",
    # Bitcoin RPC
    "python-bitcoinrpc>=1.0,<2",
    # Encoding
    "cbor2>=5.9,<6",
    "bitarray>=3.8,<4",
    "py-multibase>=2.0,<3",
    "base58>=2.1,<3",
    "jcs>=0.2,<1",
    "ecdsa>=0.19,<1",
    # JSON-LD
    "pyld>=2.0,<3",
    # QR
    "qrcode[pil]>=8.2,<9",
    "zxing-cpp>=3.1.1,<3.2",
    "pillow>=12.0,<13",
    # HTTP (IPFS / Filebase / indexer)
    "requests>=2.33,<3",
    # Storage
    "plyvel-next",
    # Validation
    "pydantic>=2.12,<3",
    # Config
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "black>=24.0,<25",
    "mypy>=1.10,<2",
]

[project.scripts]
certichain-issue-degree = "scripts.issue_degree_vc:main"
certichain-issue-revocation = "scripts.issue_revocation_vc:main"
certichain-verify = "scripts.verify_vc_cli:main"
certichain-resolve-did = "scripts.resolve_did:main"

[tool.setuptools.packages.find]
include = ["backend*", "indexer*", "scripts*"]

[tool.setuptools.package-data]
"backend" = ["data/context/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that need regtest / IPFS / bc_index",
    "slow: tests that take more than 5 seconds",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/index_experiments/"]